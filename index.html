<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>機材管理システム</title>
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet'/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif;background:#0f1117;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
a{color:inherit;text-decoration:none}
/* ── Sidebar ── */
#sb{width:200px;background:#13151f;border-right:1px solid #252840;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#sb .logo{padding:14px 16px;font-size:13px;font-weight:700;color:#818cf8;border-bottom:1px solid #252840;letter-spacing:.05em}
#sb .grp-label{padding:10px 16px 4px;font-size:10px;font-weight:700;color:#475569;letter-spacing:.1em;text-transform:uppercase}
#sb a.nav{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13px;color:#94a3b8;cursor:pointer;transition:background .12s;border-right:2px solid transparent}
#sb a.nav:hover{background:#1e2130;color:#e2e8f0}
#sb a.nav.active{background:#1e2130;color:#818cf8;border-right-color:#818cf8}
#sb a.nav svg{flex-shrink:0;opacity:.7}
#sb a.nav.active svg{opacity:1}
/* ── Main ── */
#main{flex:1;overflow-y:auto}
.view{display:none;padding:20px}
.view.on{display:block}
/* ── Typography ── */
h2{font-size:17px;font-weight:700;margin-bottom:16px}
h3{font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:8px}
/* ── Cards ── */
.card{background:#1a1d27;border:1px solid #252840;border-radius:8px;padding:16px}
/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* ── Stat cards ── */
.sc{background:#1a1d27;border:1px solid #252840;border-radius:8px;padding:14px;cursor:pointer;transition:border-color .12s}
.sc:hover{border-color:#818cf8}
.sc .lbl{font-size:11px;color:#64748b;margin-bottom:4px}
.sc .val{font-size:26px;font-weight:700}
.sc.r .val{color:#f87171}.sc.a .val{color:#fbbf24}.sc.b .val{color:#60a5fa}
.sc.g .val{color:#34d399}.sc.p .val{color:#a78bfa}.sc.c .val{color:#38bdf8}
/* ── Badges ── */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.b-stock{background:#1e3a2f;color:#34d399}
.b-lent{background:#2a1f3d;color:#a78bfa}
.b-wait{background:#2d2a1a;color:#fbbf24}
.b-maint{background:#2d1f10;color:#fb923c}
.b-lost{background:#3a1a1a;color:#f87171}
.b-draft{background:#252840;color:#64748b}
.b-prep{background:#1e2a4a;color:#60a5fa}
.b-out{background:#2a1f3d;color:#a78bfa}
.b-using{background:#1f2a3d;color:#818cf8}
.b-retw{background:#2d2a1a;color:#fbbf24}
.b-done{background:#1e3a2f;color:#34d399}
.b-over{background:#3a1a1a;color:#f87171}
.b-cancel{background:#1e1e1e;color:#475569}
.b-own{background:#1e3a2f;color:#34d399}
.b-ext{background:#1e2a4a;color:#60a5fa}
.b-rent{background:#2d2a1a;color:#fbbf24}
/* ── Forms ── */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;background:#0f1117;border:1px solid #252840;border-radius:6px;padding:8px 10px;color:#e2e8f0;font-size:13px;outline:none;transition:border-color .12s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#6366f1}
.fg input[type=date],.fg input[type=datetime-local]{color-scheme:dark}
.date-range{display:flex;align-items:center;gap:8px}
.date-range span{color:#475569;font-size:12px;flex-shrink:0}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s}
.btn-p{background:#6366f1;color:#fff}.btn-p:hover{background:#4f46e5}
.btn-s{background:#1e2130;color:#94a3b8;border:1px solid #252840}.btn-s:hover{color:#e2e8f0}
.btn-d{background:#7f1d1d;color:#fca5a5}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:8px 10px;text-align:left;color:#64748b;font-size:11px;border-bottom:1px solid #252840;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #1a1d27;vertical-align:middle}
.tbl tr:hover td{background:#1e2130;cursor:pointer}
/* ── Toolbar ── */
.tb{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tb input,.tb select{background:#1a1d27;border:1px solid #252840;border-radius:6px;padding:8px 10px;color:#e2e8f0;font-size:13px;outline:none}
.tb input{flex:1;min-width:160px}
/* ── Filter chips ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 10px;border-radius:20px;border:1px solid #252840;background:#1a1d27;color:#94a3b8;font-size:12px;cursor:pointer;transition:all .12s}
.chip:hover,.chip.on{background:#252840;border-color:#6366f1;color:#e2e8f0}
/* ── Equipment icon ── */
.eqi{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0;overflow:hidden}
/* ── Equipment card (Minecraft style) ── */
.eq-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eq-card{background:#1a1d27;border:1px solid #252840;border-radius:8px;padding:10px;cursor:pointer;transition:border-color .12s;text-align:center}
.eq-card:hover{border-color:#6366f1}
.eq-card .ec-icon{width:56px;height:56px;border-radius:8px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.eq-card .ec-name{font-size:12px;font-weight:600;margin-bottom:2px;line-height:1.3}
.eq-card .ec-sub{font-size:10px;color:#64748b;margin-bottom:6px}
.eq-card .ec-loc{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Timeline ── */
.tline{position:relative;padding-left:22px}
.tline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:#252840}
.tl{position:relative;margin-bottom:14px}
.tl::before{content:'';position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:#6366f1;border:2px solid #1a1d27}
.tl .tdt{font-size:11px;color:#64748b}
.tl .top{font-size:12px;font-weight:600;margin:2px 0}
.tl .tdet{font-size:12px;color:#94a3b8}
/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid #252840;margin-bottom:16px}
.tab{padding:8px 14px;font-size:13px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.tab:hover{color:#94a3b8}
.tab.on{color:#818cf8;border-bottom-color:#818cf8}
.tp{display:none}.tp.on{display:block}
/* ── Slip item row ── */
.si-row{display:grid;grid-template-columns:90px 1fr 60px 1fr 1fr 80px 32px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #1a1d27}
.si-head{display:grid;grid-template-columns:90px 1fr 60px 1fr 1fr 80px 32px;gap:6px;padding:4px 0;font-size:11px;color:#64748b;border-bottom:1px solid #252840;margin-bottom:4px}
/* ── Detail panel ── */
.dh{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.dh-icon{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dh h2{font-size:18px;margin-bottom:3px}
.dh .dsub{font-size:12px;color:#64748b}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ig .ik{font-size:11px;color:#64748b;margin-bottom:1px}
.ig .iv{font-size:13px;font-weight:500}
/* ── Upload area ── */
.upa{border:2px dashed #252840;border-radius:8px;padding:18px;text-align:center;cursor:pointer;transition:border-color .12s}
.upa:hover{border-color:#6366f1}
/* ── Calendar container ── */
#cal-wrap{background:#1a1d27;border:1px solid #252840;border-radius:8px;padding:16px}
#cal-wrap .fc{color:#e2e8f0}
#cal-wrap .fc-toolbar-title{font-size:15px;font-weight:700}
#cal-wrap .fc-button{background:#252840!important;border-color:#252840!important;color:#94a3b8!important;font-size:12px!important}
#cal-wrap .fc-button:hover{background:#2d3148!important;color:#e2e8f0!important}
#cal-wrap .fc-button-active{background:#6366f1!important;color:#fff!important}
#cal-wrap .fc-daygrid-day{background:#13151f}
#cal-wrap .fc-daygrid-day.fc-day-today{background:#1a1d27}
#cal-wrap .fc-col-header-cell{background:#1a1d27;color:#64748b;font-size:11px}
#cal-wrap .fc-daygrid-day-number{color:#64748b;font-size:12px}
#cal-wrap .fc-event{cursor:pointer;border:none!important;border-radius:3px!important;font-size:11px!important;padding:1px 4px!important}
#cal-wrap .fc-scrollgrid{border-color:#252840!important}
#cal-wrap .fc-scrollgrid-section>*{border-color:#252840!important}
#cal-wrap td,.fc-theme-standard .fc-scrollgrid{border-color:#252840!important}
/* ── Settings table ── */
.st-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a1d27}
.st-row input{flex:1;background:#0f1117;border:1px solid #252840;border-radius:4px;padding:5px 8px;color:#e2e8f0;font-size:12px;outline:none}
.st-row input:focus{border-color:#6366f1}
/* ── Misc ── */
.empty{text-align:center;padding:36px;color:#64748b;font-size:13px}
.sep{height:1px;background:#252840;margin:14px 0}
.mb8{margin-bottom:8px}
.mb12{margin-bottom:12px}
.mb16{margin-bottom:16px}
.mw560{max-width:560px}
.mw720{max-width:720px}
.tbl-wrap{overflow-x:auto}
.icon-upload-area{border:2px dashed #252840;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color .12s}
.icon-upload-area:hover{border-color:#6366f1}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<div id="sb">
  <div class="logo">📦 機材管理システム</div>
  <div class="grp-label">確認</div>
  <a class="nav active" onclick="nav('dashboard')" id="n-dashboard">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="0" y="0" width="7" height="7" rx="1"/><rect x="9" y="0" width="7" height="7" rx="1"/><rect x="0" y="9" width="7" height="7" rx="1"/><rect x="9" y="9" width="7" height="7" rx="1"/></svg>
    ダッシュボード
  </a>
  <a class="nav" onclick="nav('eq-status')" id="n-eq-status">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="3"/></svg>
    機材状況
  </a>
  <a class="nav" onclick="nav('schedule')" id="n-schedule">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1 6h14" stroke="currentColor" stroke-width="1"/><rect x="4" y="1" width="2" height="3" rx="1"/><rect x="10" y="1" width="2" height="3" rx="1"/></svg>
    スケジュール
  </a>
  <div class="grp-label">登録</div>
  <a class="nav" onclick="nav('slip')" id="n-slip">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="1" width="12" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h6M5 8h6M5 11h4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
    出庫伝票
  </a>
  <a class="nav" onclick="nav('eq-reg')" id="n-eq-reg">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    機材登録
  </a>
  <a class="nav" onclick="nav('icons')" id="n-icons">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    アイコン管理
  </a>
  <div class="grp-label">管理</div>
  <a class="nav" onclick="nav('settings')" id="n-settings">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    設定
  </a>
</div>

<!-- ═══ MAIN ═══ -->
<div id="main">

<!-- ── DASHBOARD ── -->
<div id="v-dashboard" class="view on">
  <h2>ダッシュボード</h2>
  <div class="g4 mb16" id="db-stats"></div>
  <div class="g2 mb16" id="db-today-events"></div>
  <div class="g2">
    <div id="db-lent"></div>
    <div>
      <div id="db-returns" class="mb12"></div>
      <div id="db-alerts"></div>
    </div>
  </div>
</div>

<!-- ── EQUIPMENT STATUS ── -->
<div id="v-eq-status" class="view">
  <div class="tb">
    <input id="qs-q" placeholder="機材名・型番・管理番号で検索…" oninput="renderEqStatus()">
    <select id="qs-st" onchange="renderEqStatus()"><option value="">全ステータス</option></select>
    <select id="qs-cat" onchange="renderEqStatus()"><option value="">全種別</option></select>
    <select id="qs-loc" onchange="renderEqStatus()"><option value="">全管理場所</option></select>
    <select id="qs-base" onchange="renderEqStatus()">
      <option value="">全拠点</option>
      <option value="Tokyo">Tokyo</option>
      <option value="Kyoto">Kyoto</option>
    </select>
    <button class="btn btn-sm btn-s" id="qs-view-btn" onclick="toggleEqView()">📋 リスト</button>
  </div>
  <div class="chips" id="qs-chips"></div>
  <div id="eq-status-body"></div>
</div>

<!-- ── SCHEDULE ── -->
<div id="v-schedule" class="view">
  <div class="tabs mb16">
    <div class="tab on" onclick="schedTab(this,'s-cal')">カレンダー</div>
    <div class="tab" onclick="schedTab(this,'s-grid')">機材グリッド</div>
  </div>
  <div id="s-cal" class="tp on">
    <div id="cal-wrap"><div id="fc-cal"></div></div>
  </div>
  <div id="s-grid" class="tp">
    <div class="tb">
      <input type="month" id="sg-month" style="color-scheme:dark" onchange="renderSchedGrid()">
      <select id="sg-cat" onchange="renderSchedGrid()"><option value="">全種別</option></select>
    </div>
    <div class="tbl-wrap" id="sched-grid-body"></div>
  </div>
</div>

<!-- ── SLIP LIST / FORM / DETAIL ── -->
<div id="v-slip" class="view">
  <div id="slip-list-panel">
    <div class="tb">
      <input id="sl-q" placeholder="イベント名・場所・担当者で検索…" oninput="renderSlipList()">
      <select id="sl-st" onchange="renderSlipList()"><option value="">全ステータス</option></select>
      <button class="btn btn-p btn-sm" onclick="openSlipForm()">＋ 新規伝票</button>
      <button class="btn btn-s btn-sm" onclick="exportSlipsCSV()" title="伝票リストをCSVで書き出し">⬇ CSV</button>
    </div>
    <div id="slip-tbl-wrap" class="tbl-wrap"></div>
  </div>
  <div id="slip-form-panel" style="display:none">
    <div class="tb mb8">
      <button class="btn btn-s btn-sm" onclick="closeSlipForm()">← 一覧に戻る</button>
      <span id="slip-form-title" style="font-size:14px;font-weight:600;color:#e2e8f0"></span>
    </div>
    <div class="mw720">
      <div class="card mb12">
        <h3 class="mb12">イベント情報</h3>
        <div class="g2">
          <div class="fg"><label>イベント名 *</label><input id="sf-event"></div>
          <div class="fg"><label>クライアント名</label><input id="sf-client"></div>
        </div>
        <div class="g2">
          <div class="fg"><label>場所</label><input id="sf-loc"></div>
          <div class="fg"><label>担当者</label><input id="sf-person"></div>
        </div>
        <div class="g2">
          <div class="fg"><label>使用開始日時</label><input type="datetime-local" id="sf-start" style="color-scheme:dark"></div>
          <div class="fg"><label>使用終了日時</label><input type="datetime-local" id="sf-end" style="color-scheme:dark"></div>
        </div>
        <div class="g3">
          <div class="fg"><label>出庫日</label><input type="date" id="sf-checkout" style="color-scheme:dark"></div>
          <div class="fg"><label>返却予定日</label><input type="date" id="sf-ret-plan" style="color-scheme:dark"></div>
          <div class="fg"><label>実返却日</label><input type="date" id="sf-ret-actual" style="color-scheme:dark"></div>
        </div>
        <div class="fg"><label>ステータス</label>
          <select id="sf-status">
            <option>仮登録</option><option>準備中</option><option>出庫済み</option>
            <option>使用中</option><option>返却待ち</option><option>返却済み</option>
            <option>未返却</option><option>キャンセル</option>
          </select>
        </div>
        <div class="fg"><label>備考</label><textarea id="sf-notes" rows="2"></textarea></div>
      </div>
      <div class="card mb12">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <h3 style="margin:0">使用機材一覧</h3>
          <div style="display:flex;gap:6px">
            <button class="btn btn-s btn-xs" onclick="addSlipItem('own')">＋ 自社機材</button>
            <button class="btn btn-s btn-xs" onclick="addSlipItem('external')">＋ 他社機材</button>
            <button class="btn btn-s btn-xs" onclick="addSlipItem('rental')">＋ レンタル</button>
          </div>
        </div>
        <div class="si-head"><span>区分</span><span>機材名</span><span>数量</span><span>使用開始</span><span>使用終了</span><span>備考</span><span></span></div>
        <div id="sf-items"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-p" onclick="saveSlip()">保存する</button>
        <button class="btn btn-s" onclick="closeSlipForm()">キャンセル</button>
        <button class="btn btn-d btn-sm" id="sf-del-btn" style="display:none" onclick="deleteSlip()">削除</button>
      </div>
    </div>
  </div>
  <div id="slip-detail-panel" style="display:none">
    <div class="tb mb8">
      <button class="btn btn-s btn-sm" onclick="closeSlipDetail()">← 一覧に戻る</button>
    </div>
    <div id="slip-detail-body"></div>
  </div>
</div>

<!-- ── EQUIPMENT REGISTRATION ── -->
<div id="v-eq-reg" class="view">
  <div class="tb">
    <input id="er-q" placeholder="機材名・型番・管理番号で検索…" oninput="renderEqReg()">
    <select id="er-cat" onchange="renderEqReg()"><option value="">全種別</option></select>
    <button class="btn btn-p btn-sm" onclick="openEqForm()">＋ 機材登録</button>
    <button class="btn btn-s btn-sm" onclick="exportEquipmentCSV()" title="機材リストをCSVで書き出し">⬇ CSV</button>
    <label class="btn btn-s btn-sm" style="cursor:pointer" title="CSVから機材をインポート">⬆ インポート<input type="file" accept=".csv,text/csv" style="display:none" onchange="importEquipmentCSV(event)"></label>
    <button class="btn btn-sm btn-s" id="er-view-btn" onclick="toggleErView()">📋 リスト</button>
  </div>
  <div id="er-tbl-wrap" class="mb16"></div>
  <div id="eq-form-panel" style="display:none">
    <div class="sep"></div>
    <h3 id="eq-form-title" class="mb12">機材登録</h3>
    <div class="mw720">
      <div class="g2">
        <div class="fg"><label>機材名 *</label><input id="ef-name"></div>
        <div class="fg"><label>型番 *</label><input id="ef-model"></div>
      </div>
      <div class="g3">

async function loadFromDb(){
  document.body.insertAdjacentHTML('beforeend',
    '<div id="sb-loading" style="position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:9999;font-size:14px;color:#818cf8">データを読み込んでいます…</div>');
  try {
    const [eqRes, slipRes, itemRes, locRes] = await Promise.all([
      sb.from('equipment_master').select('*').order('sort_order'),
      sb.from('checkout_slips').select('*').order('usage_date', {ascending:false}),
      sb.from('checkout_slip_lines').select('*'),
      sb.from('locations').select('*').order('sort_order'),
    ]);
    if(eqRes.data?.length){
      equipment.length=0;
      eqRes.data.forEach(r=>{ const e=dbToEq(r); equipment.push(e); });
    }
    if(slipRes.data?.length){
      slips.length=0;
      slipRes.data.forEach(r=>slips.push(dbToSlip(r)));
    }
    if(itemRes.data?.length){
      slipItems.length=0;
      itemRes.data.forEach(r=>slipItems.push(dbToItem(r)));
    }
    if(locRes.data?.length){
      mLoc.length=0;
      locRes.data.forEach(r=>mLoc.push({id:r.id, name:r.name}));
    }
  } catch(err){ console.error('Supabase load error', err); }
  document.getElementById('sb-loading')?.remove();
}

async function saveEqToDb(e){
  await sb.from('equipment_master').upsert(eqToDb(e));
}
async function deleteEqFromDb(id){
  await sb.from('equipment_master').delete().eq('id',id);
}
async function deleteAllEqFromDb(ids){
  if(ids.length) await sb.from('equipment_master').delete().in('id', ids);
}
async function saveSlipToDb(s, items, removedItemIds=[]){
  await sb.from('checkout_slips').upsert(slipToDb(s));
  if(removedItemIds.length) await sb.from('checkout_slip_lines').delete().in('id', removedItemIds);
  if(items.length) await sb.from('checkout_slip_lines').upsert(items.map(itemToDb));
}
async function deleteSlipFromDb(id){
  await sb.from('checkout_slip_lines').delete().eq('slip_id', id);
  await sb.from('checkout_slips').delete().eq('id', id);
}
async function updateEqStatusInDb(id, changes){
  await sb.from('equipment_master').update(changes).eq('id', id);
}

function getIcon(cat,color,size=32,eqId=''){
  if(eqId && customIcons[eqId])
    return `<div class="eqi" style="width:${size}px;height:${size}px;background:${color}22;padding:${size>30?3:2}px;position:relative"><img src="${customIcons[eqId]}" style="width:100%;height:100%;object-fit:contain"><div style="position:absolute;inset:0;background:${color};opacity:0.4;mix-blend-mode:color;pointer-events:none"></div></div>`;
  // iconKey takes precedence over cat for SVG lookup
  const eq = eqId ? equipment.find(e=>e.id===eqId) : null;
  const key = (eq&&eq.iconKey) || cat;
  // アイコンキーレベルのカスタム画像
  if(customIconsByKey[key])
    return `<div class="eqi" style="width:${size}px;height:${size}px;background:${color}22;padding:${size>30?3:2}px;position:relative"><img src="${customIconsByKey[key]}" style="width:100%;height:100%;object-fit:contain"><div style="position:absolute;inset:0;background:${color};opacity:0.4;mix-blend-mode:color;pointer-events:none"></div></div>`;
  const fn = ICONS[key]||ICONS[cat]||ICONS['周辺機器'];
  return `<div class="eqi" style="width:${size}px;height:${size}px;background:${color}22;padding:${size>30?3:2}px">${fn(color)}</div>`;
}

// 次回使用予定を取得
function getNextUse(eqId){
  const t=today();
  const upcoming=slipItems.filter(si=>si.eqId===eqId&&si.start&&si.start.slice(0,10)>=t)
    .sort((a,b)=>a.start.localeCompare(b.start));
  if(!upcoming.length) return null;
  const si=upcoming[0];
  const sl=slips.find(s=>s.id===si.slipId);
  return {si,sl};
}

// 要対応アイテムを収集
function getAlertItems(){
  const t=today();
  const tom=dA(1);
  const issues=[];
  // 1. 返却期限超過
  equipment.forEach(e=>{
    const sl=e.slipId?slips.find(s=>s.id===e.slipId):null;
    if(sl&&sl.retPlan&&sl.retPlan<t&&!sl.retActual&&(e.status==='貸出中'||e.status==='返却待ち')){
      issues.push({type:'overdue',eq:e,sl,msg:`返却予定日（${fmtF(sl.retPlan)}）を過ぎています`});
    }
  });
  // 2. 明日使用予定なのに貸出中・返却待ち
  slipItems.forEach(si=>{
    if(!si.eqId) return;
    const slipDate=si.start?si.start.slice(0,10):'';
    if(slipDate===tom){
      const eq=equipment.find(e=>e.id===si.eqId);
      if(eq&&(eq.status==='貸出中'||eq.status==='返却待ち')){
        const sl2=slips.find(s=>s.id===si.slipId);
        // 紐づく伝票が見つからない（データ不整合で参照切れ）場合は「」のような空表示を避けるため除外
        if(sl2&&!issues.find(x=>x.eq.id===eq.id&&x.type==='tomorrow'))
          issues.push({type:'tomorrow',eq,sl:sl2,msg:`明日「${sl2.event}」で使用予定ですが現在「${eq.status}」`});
      }
    }
  });
  // 3. メンテ中・紛失確認中なのに出庫予定あり
  equipment.forEach(e=>{
    if(e.status==='メンテナンス中'||e.status==='紛失・確認中'){
      const upcoming=slipItems.filter(si=>si.eqId===e.id&&si.start&&si.start.slice(0,10)>=t);
      upcoming.forEach(si=>{
        const sl2=slips.find(s=>s.id===si.slipId);
        if(sl2&&!['返却済み','キャンセル'].includes(sl2.status)){
          issues.push({type:'unavailable',eq:e,sl:sl2,
            msg:`${e.status==='メンテナンス中'?'メンテナンス中':'紛失・確認中'}ですが「${sl2.event}」（${fmtF(si.start.slice(0,10))}）に出庫予定`});
        }
      });
    }
  });
  return issues;
}

function checkOverdue(){
  const t = today();
  equipment.forEach(e=>{
    if((e.status==='貸出中'||e.status==='返却待ち') && e.retDue && e.retDue < t) e.status='返却待ち';
  });
}

  const vEl = document.getElementById('v-'+v);

  // simpler approach
  document.querySelectorAll('#sb a.nav').forEach(el=>{
    if(el.getAttribute('onclick')&&el.getAttribute('onclick').includes("'"+v+"'")){el.classList.add('active');}
  });
  prevView = currentView;
  currentView = v;
  if(v==='dashboard') renderDashboard();

  if(v==='schedule') renderSchedule();

  if(v==='icons') renderIconManager();
  if(v==='settings') renderSettings();
}

let eqView = 'card'; // 'card' | 'list'
let erView = 'card'; // 'card' | 'list'
let eqSortCol = '';
let eqSortDir = 1;
let erSortCol = '';
let erSortDir = 1;
let slSortCol = 'start';
let slSortDir = -1;

function sortEqBy(col){ if(eqSortCol===col){eqSortDir*=-1;}else{eqSortCol=col;eqSortDir=1;} renderEqStatus(); }
function sortErBy(col){ if(erSortCol===col){erSortDir*=-1;}else{erSortCol=col;erSortDir=1;} renderEqReg(); }
function sortSlBy(col){ if(slSortCol===col){slSortDir*=-1;}else{slSortCol=col;slSortDir=-1;} renderSlipList(); }

function renderEqStatus(){
  // Populate selects
  const stSel=document.getElementById('qs-st');
  if(stSel.options.length<=1){ mStatus.forEach(s=>{const o=document.createElement('option');o.textContent=s.name;stSel.appendChild(o);}); }
  const catSel=document.getElementById('qs-cat');
  if(catSel.options.length<=1){ mCat.forEach(c=>{const o=document.createElement('option');o.textContent=c.name;catSel.appendChild(o);}); }
  const locSel=document.getElementById('qs-loc');
  if(locSel.options.length<=1){ mLoc.forEach(l=>{const o=document.createElement('option');o.textContent=l.name;locSel.appendChild(o);}); }

  // Chips
  const chipEl=document.getElementById('qs-chips');
  if(!chipEl.innerHTML){ chipEl.innerHTML=mStatus.map(s=>`<span class="chip" onclick="toggleChip(this,'${s.name}')">${s.name}</span>`).join(''); }

  const q=(document.getElementById('qs-q').value||'').toLowerCase();
  const st=document.getElementById('qs-st').value;
  const cat=document.getElementById('qs-cat').value;
  const loc=document.getElementById('qs-loc').value;
  const base=document.getElementById('qs-base').value;
  const chips=[...document.querySelectorAll('#qs-chips .chip.on')].map(c=>c.textContent);

  const slipMapS={};
  slips.forEach(s=>{ slipMapS[s.id]=s; });

  const list = equipment.filter(e=>{
    if(q&&!`${e.name}${e.model}${e.serial}`.toLowerCase().includes(q)) return false;
    if(st&&e.status!==st) return false;
    if(cat&&e.cat!==cat) return false;
    if(loc&&e.defLoc!==loc) return false;
    if(base&&e.base!==base) return false;
    if(chips.length&&!chips.includes(e.status)) return false;
    return true;
  }).sort((a,b)=>{
    if(!eqSortCol) return 0;
    const sa=slipMapS[a.slipId], sb=slipMapS[b.slipId];
    let va='',vb='';
    if(eqSortCol==='name'){va=a.name;vb=b.name;}
    else if(eqSortCol==='status'){va=a.status;vb=b.status;}
    else if(eqSortCol==='base'){va=a.base||'';vb=b.base||'';}
    else if(eqSortCol==='location'){va=a.location||'';vb=b.location||'';}
    else if(eqSortCol==='holder'){va=a.holder||'';vb=b.holder||'';}
    else if(eqSortCol==='retPlan'){va=sa?sa.retPlan:'';vb=sb?sb.retPlan:'';}
    if(va<vb) return -eqSortDir;
    if(va>vb) return eqSortDir;
    return 0;
  });

  const body=document.getElementById('eq-status-body');
  if(!list.length){ body.innerHTML='<div class="empty">該当機材なし</div>'; return; }

  if(eqView==='card'){
    body.innerHTML=`<div class="eq-cards">${list.map(e=>{
      const sl=e.slipId?slips.find(s=>s.id===e.slipId):null;
      return `<div class="eq-card" onclick="openDetail('${e.id}')">
        <div class="ec-icon" style="background:${e.color}22">${getIcon(e.cat,e.color,44,e.id)}</div>
        <div class="ec-name">${e.name}</div>
        <div class="ec-sub">${e.model}</div>
        <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:4px">${ebdg(e.status)}${baseBdg(e.base)}</div>
        <div class="ec-loc">${e.location||'—'}</div>
        ${sl?`<div style="font-size:10px;color:#818cf8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sl.event}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  } else {
    // ソート適用
    const slipMap={};
    slips.forEach(s=>{ slipMap[s.id]=s; });
    const sorted=[...list].sort((a,b)=>{
      if(!eqSortCol) return 0;
      const sa=slipMap[a.slipId];
      const sb=slipMap[b.slipId];
      let va='',vb='';
      if(eqSortCol==='name'){va=a.name;vb=b.name;}
      else if(eqSortCol==='model'){va=a.model;vb=b.model;}
      else if(eqSortCol==='serial'){va=a.serial;vb=b.serial;}
      else if(eqSortCol==='status'){va=a.status;vb=b.status;}
      else if(eqSortCol==='base'){va=a.base;vb=b.base;}
      else if(eqSortCol==='location'){va=a.location||'';vb=b.location||'';}
      else if(eqSortCol==='holder'){va=a.holder||'';vb=b.holder||'';}
      else if(eqSortCol==='event'){va=sa?sa.event:'';vb=sb?sb.event:'';}
      else if(eqSortCol==='retPlan'){va=sa?sa.retPlan:'';vb=sb?sb.retPlan:'';}
      if(va<vb) return -eqSortDir;
      if(va>vb) return eqSortDir;
      return 0;
    });
    const sh=(col,label)=>{
      const active=eqSortCol===col;
      const arrow=active?(eqSortDir===1?' ↑':' ↓'):'';
      return `<th style="cursor:pointer;user-select:none;${active?'color:#818cf8':''}" onclick="sortEqBy('${col}')">${label}${arrow}</th>`;
    };
    body.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th width="44"></th>
      ${sh('name','機材名')}${sh('model','型番')}${sh('serial','管理番号')}
      ${sh('status','ステータス')}${sh('base','拠点')}${sh('location','現在地')}${sh('holder','保有者')}
      ${sh('event','使用中イベント')}${sh('retPlan','返却予定')}
      <th style="white-space:nowrap;color:#64748b;font-size:11px">次回使用予定</th>
    </tr></thead><tbody>${sorted.map(e=>{
      const sl=e.slipId?slipMap[e.slipId]:null;
      const nextUse=getNextUse(e.id);
      const nextUseHtml=nextUse
        ?`<div style="font-size:11px;color:#818cf8;white-space:nowrap">${fmt(nextUse.si.start)}</div><div style="font-size:10px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px">${nextUse.sl?nextUse.sl.event:''}</div>`
        :'<span style="color:#475569">—</span>';
      return `<tr onclick="openDetail('${e.id}')">
        <td>${getIcon(e.cat,e.color,30,e.id)}</td>
        <td style="font-weight:600">${e.name}</td>
        <td style="color:#94a3b8">${e.model}</td>
        <td style="color:#64748b;font-size:12px">${e.serial}</td>
        <td>${ebdg(e.status)}</td>
        <td>${baseBdg(e.base)||'—'}</td>
        <td>${e.location||'<span style="color:#f87171">未設定</span>'}</td>
        <td style="font-size:12px">${e.holder||'—'}</td>
        <td style="font-size:12px;color:#818cf8">${sl?sl.event:'—'}</td>
        <td style="font-size:12px">${sl?fmtF(sl.retPlan):'—'}</td>
        <td>${nextUseHtml}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
  }
}

function toggleChip(el,val){
  const wasOn=el.classList.contains('on');
  document.querySelectorAll('#qs-chips .chip').forEach(c=>c.classList.remove('on'));
  const st=document.getElementById('qs-st');
  if(!wasOn){ el.classList.add('on'); st.value=val; }
  else { st.value=''; }
  renderEqStatus();
}

function toggleLendForm(id){
  const f=document.getElementById('lend-form-'+id);
  if(!f) return;
  f.style.display=f.style.display==='none'?'':'none';
}

function saveLending(id){
  const e=equipment.find(x=>x.id===id);
  if(!e) return;
  const newLoc=document.getElementById('lf-loc-'+id).value.trim()||e.defLoc;
  const newHolder=document.getElementById('lf-holder-'+id).value.trim();
  const newEvent=document.getElementById('lf-event-'+id).value.trim();
  const newRetPlan=document.getElementById('lf-ret-'+id).value;
  const oldLoc=e.location||e.defLoc;
  // 伝票IDを名前検索でマッチング（任意）
  const matchSlip=newEvent?slips.find(s=>s.event===newEvent):null;
  historyLog.push({
    id:crypto.randomUUID(),eqId:id,
    dt:new Date().toISOString().slice(0,16),
    op:'出庫',from:oldLoc,to:newLoc,
    fromP:'',toP:newHolder,
    slip:matchSlip?matchSlip.id:'',
    memo:newEvent
  });
  e.status='貸出中';
  e.location=newLoc;
  e.holder=newHolder;
  if(matchSlip) e.slipId=matchSlip.id;
  saveToLocal();
  openDetail(id);
}

function saveReturn(id){
  const e=equipment.find(x=>x.id===id);
  if(!e) return;
  const oldLoc=e.location||'';
  historyLog.push({
    id:crypto.randomUUID(),eqId:id,
    dt:new Date().toISOString().slice(0,16),
    op:'返却',from:oldLoc,to:e.defLoc,
    fromP:e.holder||'',toP:'',
    slip:e.slipId||'',memo:''
  });
  e.status='在庫あり';
  e.location=e.defLoc;
  e.holder='';
  e.slipId='';
  saveToLocal();
  openDetail(id);
}

function toggleStatusForm(id){
  const f=document.getElementById('status-form-'+id);
  if(!f) return;
  f.style.display=f.style.display==='none'?'':'none';
}

function saveStatusUpdate(id){
  const e=equipment.find(x=>x.id===id);
  if(!e) return;
  const newStatus=document.getElementById('sf-up-status-'+id).value;
  const newLoc=document.getElementById('sf-up-loc-'+id).value.trim();
  const memo=document.getElementById('sf-up-memo-'+id).value.trim();
  const oldStatus=e.status;
  const oldLoc=e.location||'';
  if(newStatus===oldStatus && newLoc===oldLoc && !memo){ toggleStatusForm(id); return; }
  historyLog.push({
    id:crypto.randomUUID(),eqId:id,
    dt:new Date().toISOString().slice(0,16),
    op:'状況更新',from:oldStatus,to:newStatus,
    fromP:oldLoc,toP:newLoc||oldLoc,
    slip:'',memo:memo
  });
  e.status=newStatus;
  if(newLoc) e.location=newLoc;
  saveToLocal();
  saveEqToDb(e);
  openDetail(id);
}

const SLIP_COLORS={'仮登録':'#475569','準備中':'#3b82f6','出庫済み':'#7c3aed','使用中':'#4f46e5','返却待ち':'#d97706','返却済み':'#059669','未返却':'#dc2626','キャンセル':'#374151'};

function initCalendar(){
  if(calInstance) return;
  const el=document.getElementById('fc-cal');
  if(!el||typeof FullCalendar==='undefined') return;
  const events=slips.filter(s=>s.start).map(s=>({
    id:s.id,title:s.event,start:s.start,end:s.end||s.start,
    color:SLIP_COLORS[s.status]||'#6366f1',
    extendedProps:{slip:s}
  }));
  calInstance=new FullCalendar.Calendar(el,{
    locale:'ja',initialView:'dayGridMonth',height:'auto',
    headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek'},
    events,
    eventClick:({event})=>{ openSlipDetail(event.id); },
  });
  calInstance.render();
}

function renderSchedGrid(){
  const mv=document.getElementById('sg-month').value;
  if(!mv) return;
  const [y,m]=mv.split('-').map(Number);
  const days=new Date(y,m,0).getDate();
  const catF=document.getElementById('sg-cat').value;
  const list=equipment.filter(e=>!catF||e.cat===catF);
  const nums=Array.from({length:days},(_,i)=>i+1);
  const hdr=`<tr><th style="min-width:150px;position:sticky;left:0;background:#13151f;z-index:1">機材</th>${nums.map(d=>{
    const dd=new Date(y,m-1,d);
    const isSun=dd.getDay()===0,isSat=dd.getDay()===6;
    return `<th style="width:22px;text-align:center;font-size:10px;padding:3px 1px;color:${isSun?'#f87171':isSat?'#60a5fa':'#64748b'}">${d}</th>`;
  }).join('')}</tr>`;
  const rows=list.map(e=>{
    const eSlips=slipItems.filter(i=>i.eqId===e.id).map(i=>slips.find(s=>s.id===i.slipId)).filter(Boolean);
    const cells=nums.map(d=>{
      const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hit=eSlips.find(s=>s.start&&s.end&&ds>=s.start.slice(0,10)&&ds<=s.end.slice(0,10));
      return `<td style="padding:1px;${hit?'background:'+SLIP_COLORS[hit.status]+'33':''}">${hit?`<div style="width:18px;height:12px;background:${SLIP_COLORS[hit.status]};border-radius:2px;margin:auto;cursor:pointer" title="${hit.event}" onclick="openSlipDetail('${hit.id}')"></div>`:''}</td>`;
    }).join('');
    return `<tr><td style="padding:5px 8px;white-space:nowrap;position:sticky;left:0;background:#13151f;border-bottom:1px solid #1a1d27">
      <div style="display:flex;align-items:center;gap:6px">
        ${getIcon(e.cat,e.color,20,e.id)}
        <div><div style="font-size:12px;font-weight:600">${e.name}</div><div style="font-size:10px;color:#64748b">${e.model}</div></div>
      </div></td>${cells}</tr>`;
  }).join('');
  document.getElementById('sched-grid-body').innerHTML=`<table class="tbl">${hdr}<tbody>${rows}</tbody></table>`;
}

function renderSlipList(){
  const stSel=document.getElementById('sl-st');
  if(stSel.options.length<=1){ ['仮登録','準備中','出庫済み','使用中','返却待ち','返却済み','未返却','キャンセル'].forEach(s=>{const o=document.createElement('option');o.textContent=s;stSel.appendChild(o);}); }
  const q=(document.getElementById('sl-q').value||'').toLowerCase();
  const st=document.getElementById('sl-st').value;
  const list=slips.filter(s=>{
    if(q&&!`${s.event}${s.loc}${s.person}${s.client}`.toLowerCase().includes(q)) return false;
    if(st&&s.status!==st) return false;
    return true;
  }).sort((a,b)=>{
    let va='',vb='';
    if(slSortCol==='status'){va=a.status;vb=b.status;}
    else if(slSortCol==='event'){va=a.event;vb=b.event;}
    else if(slSortCol==='loc'){va=a.loc;vb=b.loc;}
    else if(slSortCol==='person'){va=a.person;vb=b.person;}
    else if(slSortCol==='start'){va=a.start;vb=b.start;}
    else if(slSortCol==='checkout'){va=a.checkout||'';vb=b.checkout||'';}
    else if(slSortCol==='retPlan'){va=a.retPlan||'';vb=b.retPlan||'';}
    else if(slSortCol==='cnt'){
      const ca=slipItems.filter(i=>i.slipId===a.id).length;
      const cb=slipItems.filter(i=>i.slipId===b.id).length;
      return (ca-cb)*slSortDir;
    }
    if(va<vb) return -slSortDir;
    if(va>vb) return slSortDir;
    return 0;
  });
  const slSh=(col,label)=>{
    const active=slSortCol===col; const arr=active?(slSortDir===1?' ↑':' ↓'):'';
    return `<th style="cursor:pointer;user-select:none;white-space:nowrap;${active?'color:#818cf8':''}" onclick="sortSlBy('${col}')">${label}${arr}</th>`;
  };
  const rows=list.length?list.map(s=>{
    const cnt=slipItems.filter(i=>i.slipId===s.id).length;
    return `<tr onclick="openSlipDetail('${s.id}')">
      <td>${sbdg(s.status)}</td>
      <td style="font-weight:600">${s.event}</td>
      <td style="color:#94a3b8">${s.loc}</td>
      <td style="color:#94a3b8">${s.person}</td>
      <td style="font-size:12px">${fmt(s.start)}〜${fmt(s.end)}</td>
      <td style="font-size:12px">${fmtF(s.checkout)||'—'}</td>
      <td style="font-size:12px">${fmtF(s.retPlan)||'—'}</td>
      <td style="font-size:12px;color:#818cf8">${cnt}点</td>
    </tr>`;
  }).join(''):`<tr><td colspan="8" class="empty">伝票なし</td></tr>`;
  document.getElementById('slip-tbl-wrap').innerHTML=`<table class="tbl"><thead><tr>
    ${slSh('status','ステータス')}${slSh('event','イベント名')}${slSh('loc','場所')}${slSh('person','担当者')}
    ${slSh('start','使用日')}${slSh('checkout','出庫日')}${slSh('retPlan','返却予定')}${slSh('cnt','機材数')}
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function changeSlipStatus(slipId, newStatus){
  const s=slips.find(x=>x.id===slipId);
  if(!s||s.status===newStatus) return;
  s.status=newStatus;
  // 機材ステータスも連動
  slipItems.filter(i=>i.slipId===slipId&&i.eqId).forEach(i=>{
    const eq=equipment.find(e=>e.id===i.eqId);
    if(!eq) return;
    if(['出庫済み','使用中'].includes(newStatus)){ eq.status='貸出中'; eq.location=s.loc; eq.holder=s.person; eq.slipId=slipId; }
    else if(newStatus==='返却待ち'){ eq.status='返却待ち'; }
    else if(newStatus==='返却済み'){ eq.status='在庫あり'; eq.location=eq.defLoc; eq.holder=''; eq.slipId=''; }
  });
  // select の色を更新
  const sel=event.target;
  const style=SLIP_STATUS_STYLE[newStatus]||{bg:'#252840',fg:'#64748b'};
  sel.style.background=style.bg; sel.style.color=style.fg;
  saveToLocal();
}

function openSlipForm(id=''){
  // ensure we are in slip view
  if(currentView!=='slip'){ nav('slip'); openSlipForm(id); return; }
  editingSlipId=id||null;
  document.getElementById('slip-list-panel').style.display='none';
  document.getElementById('slip-detail-panel').style.display='none';
  document.getElementById('slip-form-panel').style.display='';
  document.getElementById('slip-form-title').textContent=id?'出庫伝票 編集':'出庫伝票 新規登録';
  document.getElementById('sf-del-btn').style.display=id?'':'none';
  document.getElementById('sf-items').innerHTML='';
  sfItemCount=0;

  const s=id?slips.find(x=>x.id===id):null;
  // datetime-local 入力は "YYYY-MM-DDTHH:mm" 形式以外を受け付けず、
  // 日付のみ（例: Supabase の date型から来た "2026-06-05"）を渡すと値が空にリセットされてしまう。
  // それを編集→保存すると開始日・終了日が空文字になり、ダッシュボードの一覧から消えてしまうため、時刻を補完する。
  const toDtLocal=v=>{
    if(!v) return '';
    const str=String(v);
    return /^\d{4}-\d{2}-\d{2}$/.test(str) ? str+'T00:00' : str.slice(0,16);
  };
  document.getElementById('sf-event').value=s?s.event:'';
  document.getElementById('sf-client').value=s?s.client:'';
  document.getElementById('sf-loc').value=s?s.loc:'';
  document.getElementById('sf-person').value=s?s.person:'';
  document.getElementById('sf-start').value=s?toDtLocal(s.start):'';
  document.getElementById('sf-end').value=s?toDtLocal(s.end):'';
  document.getElementById('sf-checkout').value=s?s.checkout:'';
  document.getElementById('sf-ret-plan').value=s?s.retPlan:'';
  document.getElementById('sf-ret-actual').value=s?s.retActual:'';
  document.getElementById('sf-status').value=s?s.status:'仮登録';
  document.getElementById('sf-notes').value=s?s.notes:'';
  if(id){
    slipItems.filter(i=>i.slipId===id).forEach(i=>addSlipItem(i.type,i));
  }
  document.getElementById('slip-form-panel').scrollIntoView({behavior:'smooth'});
}

let sfItemCount=0;

function checkEqConflicts(eqId,rowId){
  const row=document.getElementById(rowId);
  if(!row) return;
  let warn=row.querySelector('.eq-warn');
  if(!warn){ warn=document.createElement('div'); warn.className='eq-warn'; warn.style.cssText='grid-column:1/-1;padding:6px 8px;border-radius:4px;font-size:11px;margin-top:2px'; row.after(warn); }
  warn.innerHTML='';
  if(!eqId) return;
  const eq=equipment.find(e=>e.id===eqId);
  if(!eq) return;
  const msgs=[];
  // ステータスチェック
  if(eq.status==='メンテナンス中') msgs.push(`⚠ <strong>${eq.name}</strong> は現在メンテナンス中です`);
  else if(eq.status==='紛失・確認中') msgs.push(`⚠ <strong>${eq.name}</strong> は紛失・確認中です`);
  else if(eq.status==='貸出中'){
    const sl=eq.slipId?slips.find(s=>s.id===eq.slipId):null;
    msgs.push(`⚠ <strong>${eq.name}</strong> は現在貸出中です${sl?'（'+sl.event+'、返却予定: '+fmtF(sl.retPlan)+'）':''}`);
  } else if(eq.status==='返却待ち'){
    msgs.push(`⚠ <strong>${eq.name}</strong> は現在返却待ちです`);
  }
  // 重複予約チェック（既存slipItemsとの期間重複）
  const sfStart=document.getElementById('sf-start')?.value;
  const sfEnd=document.getElementById('sf-end')?.value;
  if(sfStart||sfEnd){
    const newStart=(sfStart||'').slice(0,10);
    const newEnd=(sfEnd||'').slice(0,10);
    slipItems.filter(si=>si.eqId===eqId&&si.slipId!==editingSlipId).forEach(si=>{
      const siStart=si.start?si.start.slice(0,10):'';
      const siEnd=si.end?si.end.slice(0,10):siStart;
      const overlap=(newStart<=siEnd&&newEnd>=siStart)||(newStart<=siStart&&newEnd>=siStart)||(newStart>=siStart&&newStart<=siEnd);
      if(overlap){
        const sl=slips.find(s=>s.id===si.slipId);
        if(sl&&!['返却済み','キャンセル'].includes(sl.status))
          msgs.push(`⚠ 期間が別イベント「${sl.event}」（${fmt(siStart)}〜${fmt(siEnd)}）と重複しています`);
      }
    });
  }
  if(msgs.length){
    warn.style.background='#3a2010';
    warn.style.border='1px solid #fb923c44';
    warn.style.color='#fb923c';
    warn.innerHTML=msgs.join('<br>');
  } else {
    warn.remove();
  }
}

function addSlipItem(type,data=null){
  sfItemCount++;
  const rowId='sfi-'+sfItemCount;
  const eqOptions=equipment.map(e=>`<option value="${e.id}">${e.name} (${e.model})</option>`).join('');
  const isOwn=type==='own';
  const div=document.createElement('div');
  div.className='si-row'; div.id=rowId; div.dataset.type=type;
  div.innerHTML=`
    ${ibdg(type)}
    <div>${isOwn
      ?`<select class="si-eq" onchange="checkEqConflicts(this.value,'${rowId}')" style="width:100%;background:#0f1117;border:1px solid #252840;border-radius:4px;padding:5px 6px;color:#e2e8f0;font-size:12px;outline:none"><option value="">選択…</option>${eqOptions}</select>`
      :`<input class="si-name" placeholder="機材名を入力" style="width:100%;background:#0f1117;border:1px solid #252840;border-radius:4px;padding:5px 6px;color:#e2e8f0;font-size:12px;outline:none" value="${data?data.name:''}">`
    }</div>
    <input type="number" class="si-qty" value="${data?data.qty:1}" min="1" style="background:#0f1117;border:1px solid #252840;border-radius:4px;padding:5px 6px;color:#e2e8f0;font-size:12px;outline:none;width:100%">
    <input type="datetime-local" class="si-start" value="${data?data.start.slice(0,16):''}" style="background:#0f1117;border:1px solid #252840;border-radius:4px;padding:4px 6px;color:#e2e8f0;font-size:11px;outline:none;width:100%;color-scheme:dark">
    <input type="datetime-local" class="si-end" value="${data?data.end.slice(0,16):''}" style="background:#0f1117;border:1px solid #252840;border-radius:4px;padding:4px 6px;color:#e2e8f0;font-size:11px;outline:none;width:100%;color-scheme:dark">

// 機材に紐づく伝票の中から「現在最も該当する伝票」を日程基準で判定する
// （返却済み・キャンセルは除外し、①使用期間が今日を含むもの→②直近の予定→③直近の過去、の優先順で選ぶ）
// 「使用中イベント」「貸出中／返却待ち」は、あくまで“今まさに出庫されている伝票”だけに連動させる。
// 仮登録・準備中・将来予定の伝票は、機材の現在ステータスや現在地を上書きしない（日程と表記の食い違いを防ぐ）。
function syncEqWithCurrentSlip(eqId){
  const eq=equipment.find(e=>e.id===eqId);
  if(!eq) return;
  // メンテナンス中・紛失確認中は伝票連動の対象外（手動の状況更新で管理）
  if(eq.status==='メンテナンス中'||eq.status==='紛失・確認中') return;
  const t=today();
  const dateOf=s=>({start:s.start?s.start.slice(0,10):'',end:s.end?s.end.slice(0,10):''});
  const linked=[...new Set(slipItems.filter(si=>si.eqId===eqId).map(si=>si.slipId))]
    .map(sid=>slips.find(s=>s.id===sid)).filter(Boolean);
  // 「現在まさに持ち出し中」とみなせる伝票 = 使用期間が今日を含み、かつ伝票ステータスが実出庫系（出庫済み/使用中/返却待ち）
  const active=linked.filter(s=>{
    const d=dateOf(s);
    return !['返却済み','キャンセル'].includes(s.status)&&d.start&&d.start<=t&&(!d.end||d.end>=t)
      &&['出庫済み','使用中','返却待ち'].includes(s.status);
  }).sort((a,b)=>dateOf(b).start.localeCompare(dateOf(a).start));

  if(active.length){
    const cur=active[0];
    eq.slipId=cur.id;
    if(['出庫済み','使用中'].includes(cur.status)){ eq.status='貸出中'; eq.location=cur.loc; eq.holder=cur.person; }
    else { eq.status='返却待ち'; eq.location=cur.loc; eq.holder=cur.person; }
  } else {
    // 今まさに出庫中の伝票が無い → 伝票リンクを外し、貸出中／返却待ちのままなら在庫に戻す
    // （仮登録・準備中・将来予定は「近日のイベント」等で別途確認できるため、ここでは紐付けない）
    eq.slipId='';
    if(eq.status==='貸出中'||eq.status==='返却待ち'){ eq.status='在庫あり'; eq.location=eq.defLoc; eq.holder=''; }
  }
}

function saveSlip(){
  const name=document.getElementById('sf-event').value.trim();
  if(!name){ alert('イベント名は必須です'); return; }
  const id=editingSlipId||(crypto.randomUUID());
  const slip={
    id,event:name,client:document.getElementById('sf-client').value,
    loc:document.getElementById('sf-loc').value,person:document.getElementById('sf-person').value,
    start:document.getElementById('sf-start').value,end:document.getElementById('sf-end').value,
    checkout:document.getElementById('sf-checkout').value,
    retPlan:document.getElementById('sf-ret-plan').value,
    retActual:document.getElementById('sf-ret-actual').value,
    status:document.getElementById('sf-status').value,
    notes:document.getElementById('sf-notes').value,
  };
  if(editingSlipId){ const i=slips.findIndex(s=>s.id===editingSlipId); if(i>=0) slips[i]=slip; }
  else slips.push(slip);

  // Remove old items（紐づいていた機材IDも記録して、変更後の状態を再計算する）
  const oldItems=slipItems.filter(i=>i.slipId===id);
  const removeIds=oldItems.map(i=>i.id);
  const affectedEqIds=new Set(oldItems.filter(i=>i.eqId).map(i=>i.eqId));
  removeIds.forEach(rid=>{ const idx=slipItems.findIndex(i=>i.id===rid); if(idx>=0) slipItems.splice(idx,1); });
  const newItems=[];

  // Save new items
  document.querySelectorAll('#sf-items .si-row').forEach(row=>{
    const type=row.dataset.type;
    const isOwn=type==='own';
    const eqSel=row.querySelector('.si-eq');
    const namEl=row.querySelector('.si-name');
    const eqId=isOwn&&eqSel?eqSel.value:'';
    const iname=isOwn&&eqSel?eqSel.options[eqSel.selectedIndex]?.text||'':namEl?namEl.value:'';
    const qty=parseInt(row.querySelector('.si-qty').value)||1;
    const start=row.querySelector('.si-start').value;
    const end=row.querySelector('.si-end').value;
    const notes=row.querySelector('.si-note').value;
    const item={id:crypto.randomUUID(),slipId:id,type,eqId:eqId||null,name:iname,qty,start,end,notes};
    slipItems.push(item);
    newItems.push(item);
    if(eqId) affectedEqIds.add(eqId);
  });
  // 機材ごとに「現在もっとも該当する伝票」を日程基準で再計算し、状態を同期する
  // （保存した伝票が将来予定／仮の伝票でも、それだけで現在の使用伝票が上書きされないようにする）
  affectedEqIds.forEach(eqId=>syncEqWithCurrentSlip(eqId));
  // Refresh calendar
  if(calInstance){ calInstance.destroy(); calInstance=null; }
  saveToLocal();
  saveSlipToDb(slip, newItems, removeIds);
  alert('保存しました');
  closeSlipForm();
}

function deleteSlip(){
  if(!editingSlipId||!confirm('この伝票を削除しますか？')) return;
  const i=slips.findIndex(s=>s.id===editingSlipId);
  if(i>=0) slips.splice(i,1);
  const removed=slipItems.filter(i=>i.slipId===editingSlipId);
  const affectedEqIds=[...new Set(removed.filter(it=>it.eqId).map(it=>it.eqId))];
  removed.forEach(item=>{ const idx=slipItems.indexOf(item); if(idx>=0) slipItems.splice(idx,1); });
  affectedEqIds.forEach(eqId=>syncEqWithCurrentSlip(eqId));
  if(calInstance){ calInstance.destroy(); calInstance=null; }
  saveToLocal();
  deleteSlipFromDb(editingSlipId);
  closeSlipForm();
}

  }).sort((a,b)=>{
    if(!erSortCol) return a.sort-b.sort;
    let va='',vb='';
    if(erSortCol==='name'){va=a.name;vb=b.name;}
    else if(erSortCol==='model'){va=a.model;vb=b.model;}

      return `<th${w?' width="'+w+'"':''} style="cursor:pointer;user-select:none;white-space:nowrap;${a?'color:#818cf8':''}" onclick="sortErBy('${col}')">${label}${arr}</th>`;
    };
    wrap.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th width="44"></th>

function deleteIconKey(idx){
  if(!confirm('このアイコンキーを削除しますか？\n機材に割り当てている場合は解除されます。')) return;

function updateIconKey(idx,field,val){
  const ic=mIcons[idx]; if(!ic) return;
  const v=(val==null?'':String(val)).trim();
  if(field==='key'){
    if(!v){ alert('キー名を入力してください'); renderIconKeyList(); renderIconSettings(); return; }
    if(v===ic.key) return;
    if(mIcons.some((m,i)=>i!==idx&&m.key===v)){ alert('同じキーが既に存在します'); renderIconKeyList(); renderIconSettings(); return; }
    const oldKey=ic.key;
    ic.key=v;
    // カスタム画像の紐付けを移動
    if(Object.prototype.hasOwnProperty.call(customIconsByKey,oldKey)){
      customIconsByKey[v]=customIconsByKey[oldKey];
      delete customIconsByKey[oldKey];
    }
    // このキーを参照している機材・種別マスターを追従させる
    equipment.forEach(e=>{ if(e.iconKey===oldKey) e.iconKey=v; });
    mCat.forEach(c=>{ if(c.icon===oldKey) c.icon=v; });
  } else if(field==='label'){
    ic.label=v||ic.key;
  } else if(field==='desc'){
    ic.desc=v;
  } else {
    return;
  }
  saveToLocal();
  renderIconKeyList();
  renderIconSettings();
}

  const tp=document.querySelectorAll('#v-icons .tp');

  tabs[0].classList.add('on'); tp[0].classList.add('on');
  renderIconKeyList();
  saveToLocal();
  alert('「'+label+'」を登録しました');
}

function renderSettBody(type){
  if(type==='icon'){ renderIconSettings(); return; }

    cat:{data:mCat,el:'stt-cat-body',fields:['name','icon','color']},
    loc:{data:mLoc,el:'stt-loc-body',fields:['name','base']},

  const hdrLabels={name:'名前',icon:'アイコンキー',color:'デフォルト色',cls:'バッジクラス',code:'カラーコード',base:'拠点'};

  // For cat, icon field uses a select of mIcons

        return '<select style="flex:1;background:#0f1117;border:1px solid #252840;border-radius:4px;padding:5px 6px;color:#e2e8f0;font-size:12px;outline:none" onchange="' + onb + '">' + opts + '</select>';
      }
      if(f==='color'||f==='code'){
        return '<div style="display:flex;gap:4px;flex:1">'
          + '<input value="' + val + '" onblur="' + onb + '">'
          + '<input type="color" value="' + (val||'#ffffff') + '" style="width:32px;padding:1px;border:1px solid #252840;border-radius:4px;background:#0f1117" onchange="' + onb + '">'
          + '</div>';

function uploadIconByKey(key, event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { customIconsByKey[key] = e.target.result; renderIconSettings(); saveToLocal(); };
  reader.readAsDataURL(file);
}

function clearIconByKey(key){
  delete customIconsByKey[key];
  renderIconSettings();
  saveToLocal();
}

function addIconKey(){
  const key=document.getElementById('new-icon-key').value.trim();
  const label=document.getElementById('new-icon-label').value.trim()||key;
  const desc=document.getElementById('new-icon-desc').value.trim();
  if(!key){ alert('キー名を入力してください'); return; }
  if(mIcons.find(i=>i.key===key)){ alert('同じキーが既に存在します'); return; }
  mIcons.push({id:'i'+Date.now(),key,label,desc});
  renderIconSettings();
  document.getElementById('new-icon-key').value='';
  document.getElementById('new-icon-label').value='';
  document.getElementById('new-icon-desc').value='';
}

function updateSett(type,idx,field,val){
  const map={cat:mCat,loc:mLoc,status:mStatus,own:mOwn,color:mColors};
  if(map[type]&&map[type][idx]){ map[type][idx][field]=val; saveToLocal(); }
}
function deleteSett(type,idx){
  const map={cat:mCat,loc:mLoc,status:mStatus,own:mOwn,color:mColors};
  if(map[type]){ map[type].splice(idx,1); renderSettBody(type); saveToLocal(); }
}
function addSettRow(type){
  const map={cat:mCat,loc:mLoc,status:mStatus,own:mOwn,color:mColors};
  const templates={cat:{id:'c'+Date.now(),name:'新種別',icon:'周辺機器',color:'#94a3b8'},
    loc:{id:'l'+Date.now(),name:'新場所'},status:{id:'s'+Date.now(),name:'新ステータス',cls:'b-draft'},
    own:{id:'o'+Date.now(),name:'新区分'},color:{id:'co'+Date.now(),name:'新色',code:'#ffffff'}};
  map[type].push(templates[type]||{id:'x'+Date.now(),name:'新項目'});
  renderSettBody(type); saveToLocal();
}

//  LOCAL STORAGE
// ═══════════════════════════════════════════════
const LS_KEY = 'kikazai_v1';

function saveToLocal(){
  try {
    const eqWithImg = equipment.map(e => {
      const obj = {...e};
      if(customIcons[e.id]) obj._img = customIcons[e.id];
      return obj;
    });
    const data = {
      equipment: eqWithImg, slips, slipItems, historyLog,
      mCat, mLoc, mStatus, mOwn, mIcons, customIconsByKey,
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e) { console.warn('save failed', e); }
}

function loadFromLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    const replaceArr = (target, src) => { if(!src) return; target.length=0; src.forEach(x=>target.push(x)); };
    if(d.equipment){
      equipment.length=0;
      d.equipment.forEach(e=>{ const img=e._img; delete e._img; equipment.push(e); if(img) customIcons[e.id]=img; });
    }
    replaceArr(slips, d.slips);
    replaceArr(slipItems, d.slipItems);
    replaceArr(historyLog, d.historyLog);
    replaceArr(mCat, d.mCat);
    replaceArr(mLoc, d.mLoc);
    replaceArr(mStatus, d.mStatus);
    replaceArr(mOwn, d.mOwn);
    replaceArr(mIcons, d.mIcons);
    if(d.customIconsByKey) Object.assign(customIconsByKey, d.customIconsByKey);
    return true;
  } catch(e) { console.warn('load failed', e); return false; }
}

function clearLocalData(){
  if(!confirm('保存中のデータをすべて削除してサンプルデータに戻しますか？\nこの操作は取り消せません。')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function downloadCSV(filename, headers, rows){
  const bom = '﻿';
  const csv = bom + [headers, ...rows].map(r=>
    r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function colorNameFromCode(code){
  const m=mColors.find(c=>c.code===code);
  return m?m.name:(code||'');
}
function colorCodeFromInput(val){
  if(!val) return '#60a5fa';
  const v=String(val).trim();
  if(/^#[0-9a-fA-F]{3,8}$/.test(v)) return v;
  const m=mColors.find(c=>c.name===v);
  return m?m.code:'#60a5fa';
}

function exportEquipmentCSV(){
  const headers=['ID','機材名','型番','管理番号','メーカー','種別','所有区分','拠点','管理場所','在庫数','ステータス','現在地','保有者','色','備考'];
  const rows=equipment.map(e=>[e.id,e.name,e.model,e.serial,e.maker,e.cat,e.own,e.base||'',e.defLoc,e.qty,e.status,e.location||'',e.holder||'',colorNameFromCode(e.color),e.notes||'']);
  downloadCSV('equipment.csv',headers,rows);
}

function exportSlipsCSV(){
  const headers=['ID','イベント名','クライアント','場所','担当者','使用開始','使用終了','出庫日','返却予定日','実返却日','ステータス','備考'];
  const rows=slips.map(s=>[s.id,s.event,s.client||'',s.loc,s.person,s.start||'',s.end||'',s.checkout||'',s.retPlan||'',s.retActual||'',s.status,s.notes||'']);
  downloadCSV('slips.csv',headers,rows);
}

function parseCSVLine(line){
  const result=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){
      if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ;
    } else if(line[i]===','&&!inQ){result.push(cur);cur='';}
    else cur+=line[i];
  }
  result.push(cur); return result;
}

function importEquipmentCSV(event){
  const file=event.target.files[0]; if(!file) return;
  event.target.value=''; // reset input
  // 重複IDの扱いをインポート開始時に1回だけ確認し、ファイル全体に適用する
  const overwrite = confirm('CSV内に既存の機材と同じIDがある場合、データを上書きしますか？\n\n「OK」：上書きする（既存データを更新）\n「キャンセル」：上書きしない（新規分のみ追加し、既存はそのまま）');
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(lines.length<2){alert('データがありません');return;}
    let added=0,updated=0,skipped=0;
    lines.slice(1).forEach(line=>{
      const c=parseCSVLine(line);
      if(c.length<2||!c[1]) return;
      const id=c[0]||('E'+Date.now());
      const data={
        id,name:c[1],model:c[2]||'',serial:c[3]||'',maker:c[4]||'',
        cat:c[5]||mCat[0]?.name||'',own:c[6]||mOwn[0]?.name||'',
        base:c[7]||'',defLoc:c[8]||mLoc[0]?.name||'',
        qty:parseInt(c[9])||1,status:c[10]||'在庫あり',
        location:c[11]||c[8]||'',holder:c[12]||'',
        color:colorCodeFromInput(c[13]),notes:c[14]||'',
        sort:equipment.length+1,fav:false,iconKey:'',slipId:'',
      };
      const idx=equipment.findIndex(e=>e.id===id);
      if(idx>=0){
        if(overwrite){ Object.assign(equipment[idx],data); updated++; }
        else skipped++;
      }
      else{equipment.push(data);added++;}
    });
    const msg='インポート完了：新規'+added+'件、更新'+updated+'件'+(skipped?'、スキップ'+skipped+'件（既存IDのため上書きしませんでした）':'');
    alert(msg);
    renderEqReg();
  };
  reader.readAsText(file,'UTF-8');
}
